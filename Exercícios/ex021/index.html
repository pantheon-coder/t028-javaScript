<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 1px solid black;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
      }
      tr {
        background-color: aliceblue;
      }
    </style>
  </head>
  <body>
    <label for="">Nome do Produto:</label>
    <input type="text" name="" id="inputNome" />
    <label for="">Quantidade:</label>
    <input type="number" name="" id="inputQuantidade" />
    <input onclick="cadastrar()" type="button" value="Cadastrar" />

    <h2>Produtos Cadastrados</h2>

    <table id="tabela">
      <tr>
        <th>Produtos</th>
        <th>Quantidade</th>
      </tr>
    </table>

    <script>
      function cadastrar() {
        const produtoNome = document.getElementById("inputNome").value;
        const produtoQuantidade = Number.parseInt(
          document.getElementById("inputQuantidade").value
        );

        if (produtoNome == "") {
          alert("Digite o nome do produto!");
          return;
        }

        if (isNaN(produtoQuantidade) || produtoQuantidade <= 0) {
          alert("Por favor, insira uma quantidade válida!");
          return;
        }

        // Recupera uma lista chamada produtos do localStorage, se essa lista não existir ele cria uma nova.
        let produtos = JSON.parse(localStorage.getItem("produtos")) || [];

        // Adcionar novo produto
        produtos.push({ nome: produtoNome, quantidade: produtoQuantidade });

        //Salvar de volta no localStorage
        localStorage.setItem("produtos", JSON.stringify(produtos));
        exibirProdutos();
      }

      function exibirProdutos() {
        let tabela = document.getElementById("tabela");
        tabela.innerHTML = `
            <tr>
                <th>Produtos</th>
                <th>Quantidade</th>
            </tr>`;

        let produtos = JSON.parse(localStorage.getItem("produtos")) || [];

        produtos.forEach((produto) => {
          let row = tabela.insertRow();
          row.insertCell(0).innerText = produto.nome;
          row.insertCell(1).innerText = produto.quantidade;
        });
      }
      window.onload = exibirProdutos;
    </script>
  </body>
</html>
